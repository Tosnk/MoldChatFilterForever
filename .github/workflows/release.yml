name: release

# On a version tag (v1.2.3): check TOC and CHANGELOG agree with the tag, run the Core tests,
# zip the addon exactly as CurseForge packages it, and publish a GitHub release whose notes are
# that version's CHANGELOG section. CurseForge itself is fed by its own GitHub webhook
# (project Settings > Source), which packages the same tag using .pkgmeta.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: TOC and CHANGELOG match the tag
        run: |
          v="${{ steps.ver.outputs.version }}"
          grep -qx "## Version: $v" MoldChatFilterForever.toc || { echo "TOC version is not $v"; exit 1; }
          grep -qx "## $v" CHANGELOG.md || { echo "CHANGELOG.md has no '## $v' section"; exit 1; }
      - name: Core tests
        run: uv run tests/run_tests.py
      - name: Package
        run: |
          v="${{ steps.ver.outputs.version }}"
          mkdir -p dist/MoldChatFilterForever
          cp -r MoldChatFilterForever.toc Core UI icon.png LICENSE CHANGELOG.md README.md dist/MoldChatFilterForever/
          (cd dist && zip -r "MoldChatFilterForever-$v.zip" MoldChatFilterForever)
      - name: Release notes from CHANGELOG
        run: |
          v="${{ steps.ver.outputs.version }}"
          awk -v h="## $v" '$0==h{p=1;print;next} /^## /{if(p)exit} p' CHANGELOG.md > dist/notes.md
          cat dist/notes.md
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.ver.outputs.version }}"
          gh release create "v$v" "dist/MoldChatFilterForever-$v.zip" --title "$v" --notes-file dist/notes.md
