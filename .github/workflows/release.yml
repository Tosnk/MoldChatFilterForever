name: release

# On a version tag (v1.2.3), or manually for an existing tag: check TOC and CHANGELOG agree with
# the tag, run the Core tests, zip the addon exactly as CurseForge packages it, and publish a
# GitHub release whose notes are that version's CHANGELOG section. CurseForge itself is fed by
# its own GitHub webhook (project Settings > Source), which packages the same tag using .pkgmeta.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v1.0.1"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: astral-sh/setup-uv@v5
      - name: Version from tag
        id: ver
        run: |
          t="${{ inputs.tag || github.ref_name }}"
          echo "tag=$t" >> "$GITHUB_OUTPUT"
          echo "version=${t#v}" >> "$GITHUB_OUTPUT"
      - name: TOC and CHANGELOG match the tag
        run: |
          v="${{ steps.ver.outputs.version }}"
          tr -d '\r' < NoPetrovychChatFilter.toc | grep -qx "## Version: $v" || { echo "TOC version is not $v"; exit 1; }
          tr -d '\r' < CHANGELOG.md | grep -qx "## $v" || { echo "CHANGELOG.md has no '## $v' section"; exit 1; }
      - name: Core tests
        run: uv run tests/run_tests.py
      - name: Package
        run: |
          v="${{ steps.ver.outputs.version }}"
          mkdir -p dist/NoPetrovychChatFilter
          cp -r NoPetrovychChatFilter.toc Core UI icon.png LICENSE CHANGELOG.md README.md dist/NoPetrovychChatFilter/
          (cd dist && zip -r "NoPetrovychChatFilter-$v.zip" NoPetrovychChatFilter)
      - name: Release notes from CHANGELOG
        run: |
          v="${{ steps.ver.outputs.version }}"
          tr -d '\r' < CHANGELOG.md | awk -v h="## $v" '$0==h{p=1;print;next} /^## /{if(p)exit} p' > dist/notes.md
          cat dist/notes.md
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.ver.outputs.version }}"
          gh release create "${{ steps.ver.outputs.tag }}" "dist/NoPetrovychChatFilter-$v.zip" --title "$v" --notes-file dist/notes.md
